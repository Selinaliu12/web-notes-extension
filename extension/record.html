<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>錄音轉錄</title>
<style>
  :root { --bg:#f6f6f8; --card:#fff; --fg:#1d1d1f; --mut:#6e6e73; --line:#e2e2e7; --acc:#0a66d6; --soft:#f0f0f4; --rec:#e5484d; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1c1e; --card:#2a2a2d; --fg:#f2f2f4; --mut:#9a9aa1; --line:#46464b; --acc:#5aa2ff; --soft:#36363a; --rec:#ff6369; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.6 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; display: flex; flex-direction: column; }
  header { padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  header input.title { flex: 1; border: 0; background: transparent; color: var(--fg); font: 600 16px -apple-system, "PingFang TC", sans-serif; outline: none; min-width: 0; }
  button, select { font: inherit; cursor: pointer; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  button:hover { border-color: var(--acc); }
  button.pri { background: var(--acc); border-color: var(--acc); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .ctl { padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; border-bottom: 1px solid var(--line); }
  #rec { background: var(--rec); border-color: var(--rec); color: #fff; font-weight: 600; min-width: 108px; }
  #rec.on::before { content: "● "; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  label { display: flex; gap: 6px; align-items: center; color: var(--mut); font-size: 14px; }
  #status { padding: 6px 16px; font-size: 13px; color: var(--mut); min-height: 30px; }
  #status.err { color: var(--rec); }
  #list { flex: 1; overflow: auto; padding: 8px 16px 16px; }
  .seg { padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .seg .t { font-size: 12px; color: var(--mut); }
  .seg .en { margin-top: 2px; }
  .seg .zh { margin-top: 4px; color: var(--acc); }
  #interim { color: var(--mut); padding: 10px 0; font-style: italic; }
  .empty { color: var(--mut); text-align: center; padding: 40px 10px; }
  #sumwrap { border-top: 1px solid var(--line); background: var(--card); padding: 10px 16px 14px; max-height: 45%; overflow: auto; }
  #sumwrap .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #summary { margin-top: 10px; font-size: 14.5px; }
  #summary h3 { font-size: 15px; margin: 14px 0 4px; }
  #summary ul { margin: 4px 0; padding-left: 22px; }
  #summary p { margin: 4px 0; }
  #settings { display: none; padding: 12px 16px; background: var(--soft); border-bottom: 1px solid var(--line); font-size: 14px; }
  #settings.open { display: block; }
  #settings input[type=password], #settings input[type=text] { width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font: inherit; margin: 4px 0 10px; }
  #settings small { color: var(--mut); display: block; margin-bottom: 8px; }
</style>
</head>
<body>
<header>
  <input class="title" id="title" placeholder="錄音標題(例如:Q3 法說會)">
  <button id="gear" title="設定">⚙</button>
</header>
<div id="settings">
  <label style="color:inherit">Anthropic API key</label>
  <input type="password" id="apikey" placeholder="sk-ant-..." autocomplete="off">
  <label style="color:inherit">翻譯模型(速度優先)</label>
  <input type="text" id="fastModel">
  <label style="color:inherit">整理模型(品質優先)</label>
  <input type="text" id="sumModel">
  <small>API key 只存在這個瀏覽器的本機,翻譯與整理時才會連到 api.anthropic.com。語音辨識由 Chrome 內建引擎處理(音訊會送到 Google)。</small>
  <button class="pri" id="saveset">儲存設定</button>
</div>
<div class="ctl">
  <button id="rec">開始錄音</button>
  <select id="lang">
    <option value="en-US">英文 (美)</option>
    <option value="en-GB">英文 (英)</option>
    <option value="zh-TW">中文 (台灣)</option>
    <option value="ja-JP">日文</option>
  </select>
  <label><input type="checkbox" id="tr" checked> 即時翻成繁中</label>
  <span style="flex:1"></span>
  <button id="export">匯出 MD</button>
</div>
<div id="status"></div>
<div id="list"><div class="empty">按「開始錄音」,對著麥克風說話或播放要記錄的內容。<br>文字會即時出現在這裡。</div></div>
<div id="sumwrap">
  <div class="row"><button class="pri" id="sum">✨ AI 重點整理</button><button id="copy">複製</button><span id="sumst" style="color:var(--mut);font-size:13px"></span></div>
  <div id="summary"></div>
</div>
<script src="ai.js"></script>
<script src="record.js"></script>
</body>
</html>
