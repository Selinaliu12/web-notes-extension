<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>複習筆記</title>
<style>
  :root { --bg:#f6f6f8; --card:#fff; --fg:#1d1d1f; --mut:#6e6e73; --line:#e2e2e7; --acc:#0a66d6; --soft:#f0f0f4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1c1e; --card:#2a2a2d; --fg:#f2f2f4; --mut:#9a9aa1; --line:#46464b; --acc:#5aa2ff; --soft:#36363a; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; position: sticky; top: 0; background: var(--bg); padding: 8px 0 12px; z-index: 1; }
  input[type=search], select { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font: inherit; }
  input[type=search] { flex: 1; min-width: 180px; }
  button { font: inherit; cursor: pointer; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  button:hover { border-color: var(--acc); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip { padding: 3px 10px; border-radius: 999px; font-size: 13px; border: 1px solid var(--line); background: var(--card); color: var(--mut); }
  .chip.on { background: var(--acc); border-color: var(--acc); color: #fff; }
  .stat { color: var(--mut); font-size: 13px; margin: 4px 0 12px; }
  .art { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-bottom: 16px; }
  .art h2 { font-size: 16px; margin: 0 0 2px; }
  .art h2 a { color: inherit; text-decoration: none; }
  .art h2 a:hover { color: var(--acc); text-decoration: underline; }
  .host { font-size: 12px; color: var(--mut); margin-bottom: 10px; }
  .pn { background: var(--soft); border-radius: 10px; padding: 8px 12px; margin-bottom: 10px; white-space: pre-wrap; }
  .pn b { font-size: 12px; color: var(--mut); display: block; }
  .hl { border-left: 4px solid; padding: 2px 0 2px 12px; margin: 12px 0; }
  .q { margin: 0; }
  .c { margin-top: 4px; color: var(--mut); white-space: pre-wrap; }
  .c[contenteditable]:focus { outline: 1px dashed var(--acc); color: var(--fg); }
  .meta { font-size: 12px; color: var(--mut); margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .tag { color: var(--acc); cursor: pointer; }
  .meta .del { margin-left: auto; border: 0; background: none; color: var(--mut); padding: 0; font-size: 12px; }
  .meta .del:hover { color: #d93025; }
  .empty { text-align: center; color: var(--mut); padding: 60px 0; }
  mark { background: #fff176; color: #000; border-radius: 3px; }
  details { margin-top: 8px; } summary { cursor: pointer; color: var(--acc); font-size: 14px; }
  .rtext { white-space: pre-wrap; font-size: 14px; margin-top: 6px; }
  .rtext .zh { color: var(--acc); }
  .acts { display: flex; gap: 12px; font-size: 13px; margin-top: 8px; }
  .acts a, .acts button { color: var(--acc); background: none; border: 0; padding: 0; font: inherit; cursor: pointer; text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📚 複習筆記</h1>
  <div class="bar">
    <input type="search" id="q" placeholder="搜尋標記文字、註解、標題…">
    <select id="type"><option value="all">全部</option><option value="hl">標記</option><option value="rec">錄音</option></select>
    <select id="sort"><option value="new">最新在前</option><option value="old">最舊在前</option></select>
    <button id="export">匯出 Markdown</button>
    <button id="backup">備份 JSON</button>
    <button id="restore">匯入 JSON</button>
    <input type="file" id="file" accept="application/json" hidden>
  </div>
  <div class="chips" id="chips"></div>
  <div class="stat" id="stat"></div>
  <div id="list"></div>
</div>
<script src="review.js"></script>
</body>
</html>
