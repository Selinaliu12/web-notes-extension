<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#fff; --fg:#1d1d1f; --mut:#6e6e73; --line:#e2e2e7; --acc:#0a66d6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#2a2a2d; --fg:#f2f2f4; --mut:#9a9aa1; --line:#46464b; --acc:#5aa2ff; } }
  body { margin: 0; width: 220px; padding: 10px; background: var(--bg); color: var(--fg); font: 14px -apple-system, "PingFang TC", sans-serif; }
  button { width: 100%; padding: 9px 10px; margin-bottom: 6px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--fg); font: inherit; text-align: left; cursor: pointer; }
  button:hover { border-color: var(--acc); }
  p { margin: 6px 2px 0; font-size: 12px; color: var(--mut); }
</style>
</head>
<body>
  <button id="side">✎ 開啟/關閉本頁筆記欄</button>
  <button id="review">📚 開啟複習頁</button>
  <p id="msg"></p>
  <script src="popup.js"></script>
</body>
</html>
